name: Compute units

on: pull_request

jobs:
  cu-guard:
    permissions:
      contents: read
      pull-requests: write # for the comment
    uses: malharc373/solana-cu-guard/.github/workflows/compare.yml@v1.2.0
    with:
      solana-version: v3.1.10
      command: cargo build-sbf -- --locked && cargo test --locked --test escrow cu_report
